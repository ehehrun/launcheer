name: Swift · DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build · arm64
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      package: ${{ steps.package.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate version and tag
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Tag %s does not match Info.plist; expected v%s.\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi
          printf 'version=%s\nbuild=%s\n' "$version" "$build" >> "$GITHUB_OUTPUT"

      - name: Check build environment
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcrun swift --version

      - name: Run tests without opening windows
        run: env -u LAUNCHEER_UI_TESTS swift test -c release --no-parallel

      - name: Build app with ad-hoc signing
        run: ./scripts/build_app.sh

      - name: Check packaged app without opening windows
        shell: bash
        run: ./dist/Launcheer.app/Contents/MacOS/Launcheer --check-compatibility 2>&1 | tee dist/compatibility-check.txt

      - name: Verify signature and package DMG
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Launcheer.app
          package="Launcheer-$VERSION-$BUILD-arm64"
          stage="$RUNNER_TEMP/launcheer-dmg"
          mkdir -p "$stage"
          ditto dist/Launcheer.app "$stage/Launcheer.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Launcheer -srcfolder "$stage" -format UDZO "dist/$package.dmg"
          hdiutil verify "dist/$package.dmg"
          {
            sw_vers
            uname -m
            xcrun swift --version
            cat dist/compatibility-check.txt
          } > "dist/$package-build-info.txt"
          cd dist
          shasum -a 256 "$package.dmg" > "$package.dmg.sha256"
          shasum -a 256 -c "$package.dmg.sha256"
          printf 'name=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Save DMG, checksum, and build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.dmg
            dist/${{ steps.package.outputs.name }}.dmg.sha256
            dist/${{ steps.package.outputs.name }}-build-info.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
      PACKAGE: ${{ needs.build.outputs.package }}
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.package }}
          path: release-assets

      - name: Verify assets and publish Release
        working-directory: release-assets
        run: |
          test -f "$PACKAGE.dmg"
          test -f "$PACKAGE-build-info.txt"
          sha256sum --check "$PACKAGE.dmg.sha256"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 安装

          面向 macOS 26 及以上的 Apple Silicon Mac。打开 DMG，将 Launcheer.app 复制到本地文件夹后运行。

          同一个安装包在运行时初始化本机 Dock 原生组件，不绑定构建机的 Dock UUID 或函数偏移。
          已验证的无界面原生组件兼容检查范围见仓库 README。
          附件 build-info 记录此次构建环境与检查结果；其他系统版本和完整界面交互仍需实际验证。

          使用 ad-hoc 签名，未经过 Developer ID 签名和 Apple 公证。
          首次下载如被 macOS 阻止，请先尝试打开，再到“系统设置 → 隐私与安全性 → 仍要打开”确认 Launcheer。
          `.dmg.sha256` 为安装包的 SHA-256 校验文件。
          NOTES
          gh release create "$RELEASE_TAG" \
            "$PACKAGE.dmg" "$PACKAGE.dmg.sha256" "$PACKAGE-build-info.txt" \
            --verify-tag \
            --title "Launcheer $VERSION (build $BUILD)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
