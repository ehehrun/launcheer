name: Swift · DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build · arm64
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      package: ${{ steps.package.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate version and tag
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Tag %s does not match Info.plist; expected v%s.\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi
          printf 'version=%s\nbuild=%s\n' "$version" "$build" >> "$GITHUB_OUTPUT"

      - name: Check build environment
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcrun swift --version

      - name: Run tests without opening windows
        run: env -u LAUNCHEER_UI_TESTS swift test -c release --no-parallel

      - name: Test graphical installer package
        run: /usr/bin/python3 Tests/Fixtures/test_install_app.py

      - name: Build app with ad-hoc signing
        run: ./scripts/build_app.sh

      - name: Check packaged app without opening windows
        run: ./dist/Launcheer.app/Contents/MacOS/Launcheer --check-compatibility

      - name: Verify signature and package DMG
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          package="Launcheer-$VERSION-$BUILD-arm64"
          ./scripts/build_dmg.sh
          printf 'name=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Save DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.dmg
            dist/${{ steps.package.outputs.name }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
      PACKAGE: ${{ needs.build.outputs.package }}
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.package }}
          path: release-assets

      - name: Verify assets and publish Release
        working-directory: release-assets
        run: |
          test -f "$PACKAGE.dmg"
          sha256sum --check "$PACKAGE.dmg.sha256"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 安装

          面向 macOS 26 及以上的 Apple Silicon Mac。打开 DMG，双击 `Install Launcheer.pkg`，按 macOS 安装器提示确认并授权。
          安装器会要求退出正在运行的 Launcheer，将应用安装到当前系统盘的 `/Applications`；布局和偏好会保留。
          无需终端命令，安装流程不要求重启。完成后手动打开“应用程序”中的 Launcheer。

          同一个安装包在运行时初始化本机 Dock 原生组件，不绑定构建机的 Dock UUID 或函数偏移。
          已验证的无界面原生组件兼容检查范围见仓库 README。
          其他系统版本和完整界面交互仍需实际验证。

          PKG 未签名，内含 ad-hoc 签名的 App，未经过 Developer ID 签名和 Apple 公证。
          首次下载仍可能需要系统明确允许；安装器不绕过 macOS 安全检查。
          `.dmg.sha256` 为安装包的 SHA-256 校验文件。
          NOTES
          gh release create "$RELEASE_TAG" \
            "$PACKAGE.dmg" "$PACKAGE.dmg.sha256" \
            --verify-tag \
            --title "Launcheer $VERSION (build $BUILD)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
